apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-plain-staging
  namespace: ${config.application.namePrefix}${config.application.namespace}
spec:
  destination:
    namespace: ${config.application.namePrefix}${config.application.namespace}
    server: https://kubernetes.default.svc
  project: example-apps
  source:
    path: apps/spring-petclinic-plain/staging
    repoURL: ${scm.repoUrl}argocd/example-apps.git
    targetRevision: main
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-plain-production
  namespace: ${config.application.namePrefix}${config.application.namespace}
spec:
  destination:
    namespace: ${config.application.namePrefix}${config.application.namespace}
    server: https://kubernetes.default.svc
  project: example-apps
  source:
    path: apps/spring-petclinic-plain/production
    repoURL: ${scm.repoUrl}argocd/example-apps.git
    targetRevision: main
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true