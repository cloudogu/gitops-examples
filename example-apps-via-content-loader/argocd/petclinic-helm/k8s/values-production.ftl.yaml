service:
  port: 80

<#if config.content.variables.petclinic.baseDomain?has_content>
ingress:
  hosts:
    <#if config.application.urlSeparatorHyphen>
    - host: production-petclinic-helm-${config.content.variables.petclinic.baseDomain}.${config.application.baseUrl}
    <#else>
    - host: production.petclinic-helm.${config.content.variables.petclinic.baseDomain}.${config.application.baseUrl}
    </#if>
      paths: ['/']
</#if>
