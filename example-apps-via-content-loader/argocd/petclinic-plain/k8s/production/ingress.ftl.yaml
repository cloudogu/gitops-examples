<#if config.content.variables.petclinic.baseDomain?has_content>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-petclinic-plain
  labels:
    app: spring-petclinic-plain
spec:
  rules:
    <#assign myUrl = "${config.application.baseUrl}">
    <#if config.application.urlSeparatorHyphen>
    - host: production-petclinic-plain-${config.content.variables.petclinic.baseDomain}-${myUrl?keep_after("://")}
    <#else>
    - host: production.petclinic-plain.${config.content.variables.petclinic.baseDomain}.${myUrl?keep_after("://")}
    </#if>
      http:
        paths:
          - backend:
              service:
                name: spring-petclinic-plain
                port:
                  name: http
            path: /
            pathType: Prefix

</#if>
